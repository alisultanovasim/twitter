services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # ✅ Rate limiter storage
    cache.rate_limiter:
        class: Symfony\Component\Cache\Adapter\FilesystemAdapter
        arguments:
            - 'rate_limiter'
            - 0
            - '%kernel.cache_dir%/pools'

    # ✅ Manual limiter factory definition (TEMPORARY FIX)
    limiter.login_attempts:
        class: Symfony\Component\RateLimiter\RateLimiterFactory
        arguments:
            -
                id: 'login_attempts'
                policy: 'fixed_window'
                limit: 5
                interval: '15 minutes'
            - '@cache.rate_limiter'
            - '@lock.factory'

    # LoginFormAuthenticator
    App\Security\LoginFormAuthenticator:
        arguments:
            $loginLimiter: '@limiter.login_attempts'

    # FileUploader
    App\Service\FileUploaderService:
        arguments:
            $targetDirectory: '%tweets_upload_directory%'

    # Public services for testing
    App\Service\TweetService:
        public: true

    App\Service\UserService:
        public: true

    App\Service\NotificationService:
        public: true

    Symfony\Component\EventDispatcher\EventDispatcherInterface:
        alias: event_dispatcher
        public: true