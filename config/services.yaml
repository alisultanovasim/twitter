parameters:
    # ✅ Upload directory parametri
    tweets_upload_directory: '%kernel.project_dir%/public/uploads/tweets'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # ✅ FileUploader - artıq parametr var
    App\Service\FileUploaderService:
        arguments:
            $targetDirectory: '%tweets_upload_directory%'

    # ✅ Test üçün public services
    App\Service\TweetService:
        public: true

    App\Service\UserService:
        public: true

    App\Service\NotificationService:
        public: true

    Symfony\Component\EventDispatcher\EventDispatcherInterface:
        alias: event_dispatcher
        public: true